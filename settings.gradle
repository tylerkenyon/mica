pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
    }
}

plugins {
    // Auto-provisions JDK toolchains (JDK 25 for Minecraft 26.2) when not installed locally.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
}

// The Gradle coordinate this build publishes and, more immediately, the name a composite build
// substitutes on. Without it the coordinate defaults to the directory name (ImGUI-mc-impl), and a
// consumer's `implementation "dev.technix:mica"` silently falls through to a repository lookup
// instead of being satisfied by the included build. archivesName already produced mica-<version>.jar;
// this makes the coordinate agree with it.
rootProject.name = 'mica'
