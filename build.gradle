plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    runs {
        client {
            // Mica picks its renderer from whatever backend Minecraft chooses, so by default
            // the dev client lets Minecraft decide. Force one with
            //   -PmicaBackend=vulkan   or   -PmicaBackend=opengl
            // (passed through as Minecraft's --graphicsBackend argument) to test a specific path.
            // The old -PimguiAllowNonVulkan flag is accepted and now simply means "don't force".
            if (project.hasProperty("micaBackend")) {
                programArg "--graphicsBackend"
                programArg project.property("micaBackend").toString()
            }
            // -PmicaDemoWindow adds a plain ImGui window (text, buttons, slider, text input,
            // texture, frosted panel) for checking both backends by hand.
            if (project.hasProperty("micaDemoWindow")) {
                vmArg "-Dmica.demoWindow=true"
            }
            // Diagnostics for isolating GPU faults in the Vulkan path:
            //   -PimguiDebugClear    ImGui's pass clears its attachment magenta instead of loading
            //                        it, proving whether the pass reaches the presented image.
            //   -PimguiDebugSkipBlur skip recording the frosted-glass blur pass.
            //   -PimguiDebugSkipDraw skip recording the ImGui draw data.
            // They exist because this environment has no Vulkan validation layers installed, so
            // bisecting the GPU path by hand is the only way to localise a fault.
            if (project.hasProperty("imguiDebugClear")) {
                vmArg "-Dimgui.debug.clearAttachment=true"
            }
            if (project.hasProperty("imguiDebugSkipBlur")) {
                vmArg "-Dimgui.debug.skipBlur=true"
            }
            if (project.hasProperty("imguiDebugSkipDraw")) {
                vmArg "-Dimgui.debug.skipDraw=true"
            }
            // -PimguiQuickPlay="New World" boots straight into that singleplayer level, so the
            // in-game HUD can be checked without clicking through the menus.
            if (project.hasProperty("imguiQuickPlay")) {
                programArg "--quickPlaySingleplayer"
                programArg project.property("imguiQuickPlay").toString()
            }
        }
    }

    mods {
        "mica" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// Unit tests cover Mica's backend-independent core (backend selection, texture lifetime,
// API boundaries), which lives in the client source set.
sourceSets {
    test {
        compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output
        runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.client.output
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    mavenCentral()
    // The rest of the needed maven repositories (Fabric, Mojang, LWJGL, ...) are added by Loom automatically.
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // ---- Dear ImGui (imgui-java binding) ----
    // imgui-java publishes: imgui-java-binding (core bindings) and per-OS imgui-java-natives-*
    // (the JNI native library). The GLFW/OpenGL3 backend module (imgui-java-lwjgl3) is NOT used:
    // Mica ships its own renderers on Minecraft's device, in src/client/.../backend/vulkan
    // (VulkanImGuiBackend) and src/client/.../backend/opengl (OpenGLImGuiBackend). The OpenGL one
    // needs per-texture sampler objects, which imgui-java's ImGuiImplGl3 cannot do, and
    // imgui-java-lwjgl3 would drag a second set of LWJGL modules (GLFW, OpenGL, SDL) into the graph.
    implementation "io.github.spair:imgui-java-binding:${project.imgui_version}"
    implementation "io.github.spair:imgui-java-natives-windows:${project.imgui_version}"
    implementation "io.github.spair:imgui-java-natives-linux:${project.imgui_version}"
    implementation "io.github.spair:imgui-java-natives-macos:${project.imgui_version}"

    // ---- LWJGL Vulkan + Shaderc + OpenGL ----
    // NOTE: Minecraft 26.x already bundles org.lwjgl:lwjgl-vulkan, org.lwjgl:lwjgl-shaderc and
    // org.lwjgl:lwjgl-opengl (with natives) as part of its own libraries, so they are NOT declared
    // here; they are used directly by the backends (org.lwjgl.vulkan / org.lwjgl.util.shaderc /
    // org.lwjgl.opengl). On Windows and Linux the Vulkan loader is provided by the OS drivers; on
    // macOS LWJGL ships MoltenVK.

    // Nest every imgui-java library jar inside the mod jar (jar-in-jar) so the mod ships
    // self-contained for every platform (Windows / Linux / macOS incl. Apple Silicon).
    include "io.github.spair:imgui-java-binding:${project.imgui_version}"
    include "io.github.spair:imgui-java-natives-windows:${project.imgui_version}"
    include "io.github.spair:imgui-java-natives-linux:${project.imgui_version}"
    include "io.github.spair:imgui-java-natives-macos:${project.imgui_version}"

    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("mica-version.properties") {
        expand "version": project.version
    }

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

tasks.register("libraryJar", Jar) {
    group = "distribution"
    description = "Builds the slim library JAR for distribution."
    archiveBaseName.set("${project.archives_base_name}-lib")
    archiveVersion.set(project.version)
    destinationDirectory.set(file("$buildDir/dist-staging"))
    dependsOn "build"

    from(zipTree(file("$buildDir/libs/${project.archives_base_name}-${project.version}.jar"))) {
        exclude "dev/technix/client/**"
        exclude "fabric.mod.json"
    }
}

tasks.register("dist", Zip) {
    group = "distribution"
    description = "Bundles the slim library JAR + LICENSE.txt + library-README.md into dist/<name>-lib-<version>.zip."
    archiveBaseName.set("${project.archives_base_name}-lib")
    archiveVersion.set(project.version)
    destinationDirectory.set(file("dist"))
    dependsOn "libraryJar"

    from(tasks.named("libraryJar"))
    from("LICENSE.txt") { rename { "LICENSE.txt" } }
    from("library-README.md")
}


// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

// TEMPORARY: dumps Minecraft 26.3 class members into the CI log (reverted in the next commit).
tasks.register("probeMinecraft") {
    doLast {
        def urls = sourceSets.client.compileClasspath.files.collect { it.toURI().toURL() } as URL[]
        def loader = new URLClassLoader(urls, ClassLoader.platformClassLoader)
        def names = [
            "net.minecraft.client.KeyboardHandler", "net.minecraft.client.KeyboardManager",
            "net.minecraft.client.MouseHandler", "net.minecraft.client.input.KeyEvent",
            "net.minecraft.client.input.CharacterEvent", "net.minecraft.client.input.MouseButtonInfo",
            "net.minecraft.client.input.MouseButtonEvent", "net.minecraft.client.gui.render.GuiRenderer",
            "com.mojang.blaze3d.systems.RenderSystem", "com.mojang.blaze3d.pipeline.RenderTarget",
            "com.mojang.blaze3d.platform.InputConstants", "com.mojang.blaze3d.platform.TextInputManager",
            "com.mojang.renderpearl.frontend.FrontendGpuDevice", "com.mojang.renderpearl.frontend.FrontendCommandEncoder",
            "com.mojang.renderpearl.api.device.GpuDevice", "com.mojang.renderpearl.api.commands.CommandEncoder",
            "com.mojang.renderpearl.backend.api.GpuDeviceBackend", "com.mojang.renderpearl.backend.api.CommandEncoderBackend",
            "com.mojang.renderpearl.backend.vulkan.VulkanCommandEncoder", "com.mojang.renderpearl.backend.vulkan.VulkanDevice",
            "com.mojang.renderpearl.backend.vulkan.VulkanQueue", "com.mojang.renderpearl.backend.vulkan.VulkanInstance",
            "com.mojang.renderpearl.backend.vulkan.VulkanGpuTexture", "com.mojang.renderpearl.backend.vulkan.VulkanGpuTextureView",
            "com.mojang.renderpearl.backend.vulkan.VulkanConst", "com.mojang.renderpearl.backend.vulkan.VulkanRenderPass",
            "com.mojang.renderpearl.backend.opengl.GlTexture", "com.mojang.renderpearl.backend.opengl.GlTextureView",
            "com.mojang.renderpearl.backend.opengl.GlDevice", "com.mojang.renderpearl.backend.common.BaseGpuTexture",
            "com.mojang.renderpearl.api.textures.GpuTexture", "com.mojang.renderpearl.api.textures.GpuTextureView",
            "com.mojang.renderpearl.api.GpuFormat",
            "net.minecraft.client.Minecraft", "net.minecraft.client.gui.Gui", "net.minecraft.client.renderer.GameRenderer",
            "net.minecraft.client.renderer.texture.AbstractTexture", "net.minecraft.client.renderer.texture.TextureAtlas",
            "net.minecraft.client.renderer.texture.TextureAtlasSprite", "net.minecraft.client.renderer.texture.TextureManager",
            "net.minecraft.server.packs.resources.Resource", "net.minecraft.client.gui.screens.TitleScreen",
            "net.minecraft.client.gui.screens.PauseScreen", "net.minecraft.client.gui.screens.ChatScreen",
            "net.minecraft.client.gui.screens.inventory.AbstractContainerScreen",
            "org.lwjgl.glfw.GLFW", "org.lwjgl.sdl.SDLScancode", "org.lwjgl.sdl.SDLMouse", "org.lwjgl.sdl.SDLKeyboard",
            "org.lwjgl.opengl.GL33", "org.lwjgl.vulkan.VK10", "org.lwjgl.Version"]
        def interesting = ~/(?i)(key|char|mouse|button|move|scroll|render|device|backend|encoder|command|texture|target|width|height|view|image|queue|instance|format|toVk|glId|^id$|gl|thread|screen|gui|sprite|atlas|location|missing|U0|V0|open|resource|text|input|press|release|repeat|SDL_SCANCODE_A$|SDL_SCANCODE_ESCAPE|SDL_BUTTON|getVersion|pass)/
        names.each { n ->
            try {
                def c = Class.forName(n, false, loader)
                println "### ${n} [${java.lang.reflect.Modifier.toString(c.modifiers)}] super=${c.superclass?.name} ifaces=${c.interfaces*.name}"
                c.declaredFields.findAll { it.name =~ interesting || c.name.contains("Event") || c.name.contains("MouseButton") }.each { println "  F ${it}" }
                c.declaredMethods.findAll { it.name =~ interesting || c.name.contains("Event") || c.name.contains("MouseButton") || c.name.contains("Handler") || c.name.contains("Manager") || c.name.contains("renderpearl") }.each { println "  M ${it}" }
                if (n.endsWith("Version")) println "  LWJGL ${c.getMethod('getVersion').invoke(null)}"
            } catch (Throwable t) {
                println "### ${n} MISSING ${t}"
            }
        }
    }
}
tasks.named("compileJava") { dependsOn "probeMinecraft" }
