# Done to increase the memory available to gradle (two Loom projects are configured per build).
org.gradle.jvmargs=-Xmx3G
# Minecraft, Fabric Loader and Fabric API versions are per Minecraft version, in
# versions/<mc>/gradle.properties (Stonecutter subprojects).
# Mod Properties
mod_version=0.1
maven_group=dev.technix
archives_base_name=mica
# Dependencies
# imgui-java (Dear ImGui JNI binding)
# check this on https://central.sonatype.com/artifact/io.github.spair/imgui-java-binding
imgui_version=1.92.7.1
# LWJGL (Vulkan, OpenGL, Shaderc GLSL->SPIR-V compiler) is provided by Minecraft 26.x itself,
# so no extra LWJGL coordinates are declared in build.gradle.
# JUnit (tests only)
junit_version=5.11.4
# ASM (tests only: MixinTargetsTest)
asm_version=9.8
